<section class="settings-section">
	<h2 class="settings-section__title">password</h2>

	<label class="settings-row">
		<span class="settings-row__label">current password</span>
		<span class="settings-row__controls">
			<input #current class="settings-field" spellcheck="false" autocomplete="current-password"
				autocapitalize="off" aria-label="Current password" [type]="revealCurrent() ? 'text' : 'password'" />
			<ng-container *ngTemplateOutlet="eye; context: { $implicit: revealCurrent }" />
		</span>
	</label>

	<label class="settings-row">
		<span class="settings-row__label">new password</span>
		<span class="settings-row__controls">
			<input #next class="settings-field" spellcheck="false" autocomplete="new-password"
				autocapitalize="off" aria-label="New password" [placeholder]="'at least ' + minimumPasswordLength + ' characters'"
				[type]="revealNext() ? 'text' : 'password'" />
			<ng-container *ngTemplateOutlet="eye; context: { $implicit: revealNext }" />
		</span>
	</label>

	<p class="settings-note" role="status">{{ note() }}</p>

	<div class="settings-actions">
		<button type="button" class="settings-button" [disabled]="busy()" (click)="submit()">change</button>
	</div>
</section>

<!-- An open eye, or the same eye struck through. mousedown is cancelled so the focus — and a
     phone's keyboard — stays in the field when the eye is tapped. -->
<ng-template #eye let-revealed>
	<button type="button" class="settings-reveal" [attr.aria-pressed]="revealed()"
		[attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
		[title]="revealed() ? 'hide password' : 'show password'"
		(mousedown)="$event.preventDefault()" (click)="revealed.set(!revealed())">
		<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
			stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
			<circle cx="12" cy="12" r="3" />
			@if (revealed()) {
				<line x1="3" y1="3" x2="21" y2="21" />
			}
		</svg>
	</button>
</ng-template>
