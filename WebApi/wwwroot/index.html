<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Replaced by the controller with <base href="/_v/{token}/"> so every relative asset
	     URL below — and the module graph they import — resolves under the versioned, cache-
	     busting path (D25). Served as a static file, it is simply inert. -->
	<!--ASSET-BASE-->
	<title>Novel Reader</title>
	<!-- tui.css defines the palette both panels below draw from; it must come first. -->
	<link rel="stylesheet" href="./tui.css" />
	<link rel="stylesheet" href="./realTimeReader.css" />
	<link rel="stylesheet" href="./interactive-select/styles.css" />
	<link rel="stylesheet" href="./definition-box.css" />
</head>
<body>
	<!--
		The menu is built by src/interactive-select/module.ts when `n` opens it, so that the
		panel, its breadcrumb and its option rows have one definition rather than two.
	-->
	<nav id="navigation-container" aria-label="Navigate through your novels, search new novels" hidden></nav>
	<!--
		The top-right hint. On a keyboard it is decorative — the `n` key does the work, so it is
		aria-hidden and not focusable. On a touch device src/input/pointer.ts makes it the real
		control: a tappable button that opens the same menu (see the `touch-input` styles).
	-->
	<button id="navigation-affordance" class="navigation-affordance" type="button"
			aria-label="Open navigation menu" aria-hidden="true" tabindex="-1">
		<span class="navigation-affordance__icon" aria-hidden="true">☰</span>
		<span class="navigation-affordance__key" aria-hidden="true">n</span>
		<span class="navigation-affordance__label">navigate</span>
	</button>
	<article id="novel-paragraphs" aria-label="Novel paragraphs">

	</article>

	<!-- Classic script: defines the global `signalR`. Must run before the module that uses it. -->
	<script src="./lib/microsoft-signalr/signalr.min.js"></script>
	<!-- Entry point; it imports the interactive-select and reading modules itself. -->
	<script src="./realTimeReader.js" type="module"></script>
</body>
</html>
